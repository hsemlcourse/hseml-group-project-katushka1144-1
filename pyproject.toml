[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-insurance-cost-prediction"
version = "1.0.0"
description = "ML project for predicting medical insurance costs"
authors = [{name = "Katushka1144"}]
dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
    "matplotlib==3.8.3",
    "seaborn==0.13.2",
    "scikit-learn==1.5.0",
    "xgboost==2.0.3",
    "lightgbm==4.3.0",
    "joblib==1.3.2",
    "jupyter==1.0.0"
]